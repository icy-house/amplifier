<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmpleMusic - Authentication</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .logo {
            font-size: 32px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 28px;
            font-weight: 600;
        }
        p {
            margin: 0 0 30px 0;
            font-size: 16px;
            line-height: 1.5;
            opacity: 0.9;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        .status.success {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        .status.error {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        .button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .button:hover {
            background: #0056b3;
        }
        .button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎵</div>
        <h1>Complete Authentication</h1>
        <p>Sign in with Apple, then authorize Apple Music so your car can play your library.</p>

        <div id="status" class="status pending">Initializing…</div>

        <div id="authContainer" style="display: none;">
            <button id="signInButton" class="button" type="button">Sign in with Apple</button>
        </div>

        <div id="musicContainer" style="display: none;">
            <button id="authorizeMusicButton" class="button" type="button">Authorize Apple Music</button>
        </div>
    </div>

    <script>
        // Firebase web app: AmpleMusicAuth on amplemusic-prod
        const firebaseConfig = {
            apiKey: "AIzaSyCVNMvHscAdbxBnAJifQqxFt86XDIiFMv8",
            // Same origin as this page (custom domain) so signInWithRedirect stays same-tab
            authDomain: "ample.icy.house",
            projectId: "amplemusic-prod",
            storageBucket: "amplemusic-prod.firebasestorage.app",
            messagingSenderId: "903053386498",
            appId: "1:903053386498:web:337e03c0b65a1f8ff4581b"
        };

        const amplifierApiBase = 'https://us-central1-amplemusic-prod.cloudfunctions.net';

        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId');

        let currentUser = null;
        let sessionInitialized = false;
        let musicKitConfigured = false;
        let completing = false;

        function updateStatus(message, type, showSpinner) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;
            statusDiv.textContent = '';
            if (showSpinner) {
                const spinner = document.createElement('span');
                spinner.className = 'loading';
                spinner.setAttribute('aria-hidden', 'true');
                statusDiv.appendChild(spinner);
            }
            statusDiv.appendChild(document.createTextNode(message));
        }

        function showElement(id) {
            document.getElementById(id).style.display = 'block';
        }

        function hideElement(id) {
            document.getElementById(id).style.display = 'none';
        }

        function waitForMusicKit() {
            if (window.MusicKit) {
                return Promise.resolve(window.MusicKit);
            }
            return new Promise(function(resolve, reject) {
                var settled = false;
                var timeoutId = setTimeout(function() {
                    if (!settled) {
                        settled = true;
                        reject(new Error('MusicKit failed to load'));
                    }
                }, 20000);
                document.addEventListener('musickitloaded', function onLoaded() {
                    if (settled) {
                        return;
                    }
                    settled = true;
                    clearTimeout(timeoutId);
                    resolve(window.MusicKit);
                }, { once: true });
            });
        }

        async function fetchMusicKitDeveloperToken(idToken) {
            const url = amplifierApiBase + '/getMusicKitDeveloperToken?sessionId=' +
                encodeURIComponent(sessionId);
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + idToken
                }
            });
            const payload = await response.json().catch(function() { return {}; });
            if (!response.ok || !payload.developerToken) {
                throw new Error(payload.error || 'Failed to fetch MusicKit developer token');
            }
            return payload.developerToken;
        }

        async function ensureMusicKitConfigured() {
            if (musicKitConfigured) {
                return MusicKit.getInstance();
            }
            updateStatus('Preparing Apple Music…', 'pending', true);
            const idToken = await currentUser.getIdToken();
            const [MusicKitApi, developerToken] = await Promise.all([
                waitForMusicKit(),
                fetchMusicKitDeveloperToken(idToken)
            ]);
            await MusicKitApi.configure({
                developerToken: developerToken,
                app: {
                    name: 'AmpleMusic',
                    build: '1.0.0'
                }
            });
            musicKitConfigured = true;
            return MusicKitApi.getInstance();
        }

        async function initializeSession() {
            try {
                updateStatus('Initializing session…', 'pending', true);

                const idToken = await currentUser.getIdToken();

                const response = await fetch(amplifierApiBase + '/initializeSession', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + idToken
                    },
                    body: JSON.stringify({
                        sessionId: sessionId
                    })
                });

                const result = await response.json().catch(function() { return {}; });
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to initialize session');
                }

                sessionInitialized = true;
                updateStatus('Signed in. Authorize Apple Music to finish.', 'success', false);
                hideElement('authContainer');
                showElement('musicContainer');
            } catch (error) {
                console.error('Error initializing session:', error);
                updateStatus('Failed to initialize session: ' + error.message, 'error', false);
            }
        }

        async function authorizeAppleMusicAndComplete() {
            if (completing) {
                return;
            }
            completing = true;
            const button = document.getElementById('authorizeMusicButton');
            button.disabled = true;

            try {
                const music = await ensureMusicKitConfigured();

                updateStatus('Authorize Apple Music in the dialog…', 'pending', true);
                const authorizeResult = await music.authorize();
                const musicUserToken =
                    (typeof authorizeResult === 'string' && authorizeResult.trim())
                        ? authorizeResult.trim()
                        : (typeof music.musicUserToken === 'string' ? music.musicUserToken.trim() : '');
                if (!musicUserToken) {
                    throw new Error('Apple Music authorization did not return a user token');
                }

                updateStatus('Completing authentication…', 'pending', true);
                const idToken = await currentUser.getIdToken();

                const response = await fetch(amplifierApiBase + '/completeAuthentication', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + idToken
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        musicUserToken: musicUserToken
                    })
                });

                const result = await response.json().catch(function() { return {}; });
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to complete authentication');
                }

                hideElement('musicContainer');
                updateStatus('Authentication completed! You can return to your car.', 'success', false);

                setTimeout(function() {
                    window.close();
                }, 3000);
            } catch (error) {
                console.error('Error authorizing Apple Music:', error);
                updateStatus('Failed to authorize Apple Music: ' + error.message, 'error', false);
                button.disabled = false;
                completing = false;
            }
        }

        if (!sessionId) {
            updateStatus('Invalid session. Please scan the QR code again.', 'error', false);
        } else {
            updateStatus('Loading authentication options…', 'pending', true);

            firebase.auth().getRedirectResult().catch(function(error) {
                console.error('Redirect sign-in error:', error);
                updateStatus('Sign-in failed: ' + error.message, 'error', false);
                showElement('authContainer');
            });

            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    const label = user.email || user.displayName || 'Apple User';
                    updateStatus('Signed in as: ' + label, 'success', false);

                    if (!sessionInitialized) {
                        initializeSession();
                    } else {
                        showElement('musicContainer');
                    }
                } else {
                    updateStatus('Please sign in to continue', 'pending', false);
                    showElement('authContainer');
                }
            });
        }

        document.getElementById('signInButton').addEventListener('click', function() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            provider.addScope('email');
            provider.addScope('name');

            updateStatus('Redirecting to Apple…', 'pending', true);
            firebase.auth().signInWithRedirect(provider).catch(function(error) {
                console.error('Sign-in error:', error);
                updateStatus('Sign-in failed: ' + error.message, 'error', false);
            });
        });

        document.getElementById('authorizeMusicButton').addEventListener('click', authorizeAppleMusicAndComplete);
    </script>
</body>
</html>
